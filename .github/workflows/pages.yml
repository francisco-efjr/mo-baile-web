name: Publicar site

# A tag vX.Y.Z (igual a VERSION), enviada sozinha, publica o site no GitHub
# Pages depois do portão completo. Também roda à mão, pela aba Actions.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Portão e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Tag bate com VERSION
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ "$REF_NAME" = "v$(tr -d '[:space:]' < VERSION)" ] || { echo "::error::A tag $REF_NAME não bate com VERSION."; exit 1; }
      # npm ci: bug de dependência opcional no npm 11 (CONTRIBUTING). Sem scripts
      # de instalação: nenhuma dependência precisa deles para tipos, testes e build.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
