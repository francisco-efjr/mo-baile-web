name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versao:
    name: Versão (VERSION, package.json, CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Cópias e CHANGELOG batem com VERSION
        run: node tools/version.mjs check
      - name: Versão maior que a da branch de destino
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git show "origin/${BASE_REF}:VERSION" 2>/dev/null || echo 0.0.0)"
          head="$(cat VERSION)"
          node -e '
            const [b, h] = process.argv.slice(1).map(v => v.trim().split(".").map(Number));
            const maior = h[0] - b[0] || h[1] - b[1] || h[2] - b[2];
            if (maior <= 0) { console.error(`::error::VERSION ${process.argv[2]} não é maior que ${process.argv[1]}.`); process.exit(1); }
          ' "$base" "$head"

  motor-e-site:
    name: Tipos, motor, paridade e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      # npm ci: bug de dependência opcional no npm 11 (CONTRIBUTING). Sem scripts
      # de instalação: nenhuma dependência precisa deles para tipos, testes e build.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      # npm ci: bug de dependência opcional no npm 11 (CONTRIBUTING). Sem scripts
      # de instalação: nenhuma dependência precisa deles para tipos, testes e build.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
